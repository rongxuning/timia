services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: ${TIMIA_ENV_FILE:?set TIMIA_ENV_FILE — use deploy/dc.sh}
    volumes:
      - timia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  core-service:
    image: timia-core-service:prod
    build:
      context: ./codes/core-service
      args:
        BUILD_REVISION: ${CORE_SERVICE_REVISION:-local}
    restart: unless-stopped
    env_file: ${TIMIA_ENV_FILE:?set TIMIA_ENV_FILE — use deploy/dc.sh}
    environment:
      PATH: /app/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      FILE_SERVICE_BASE: http://file-service:8003
    command:
      [
        "sh",
        "-c",
        "python -m alembic upgrade heads && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-timia}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-timia_minio_dev}
    volumes:
      - timia_minio:/data
    expose:
      - "9000"

  file-service:
    image: timia-file-service:prod
    build:
      context: ./codes/file-service
      args:
        BUILD_REVISION: ${FILE_SERVICE_REVISION:-local}
    restart: unless-stopped
    env_file: ${TIMIA_ENV_FILE:?set TIMIA_ENV_FILE — use deploy/dc.sh}
    environment:
      PATH: /app/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      MEDIA_BACKEND: s3
      MEDIA_S3_ENDPOINT: http://minio:9000
    command:
      [
        "sh",
        "-c",
        "python -m alembic upgrade head && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8003",
      ]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      core-service:
        condition: service_healthy
    expose:
      - "8003"

  # notification-service:
  #   build: { context: ./codes/notification-service }
  #   expose: ["8001"]

  web:
    image: timia-web:prod
    build:
      context: ./codes/web
      args:
        BUILD_REVISION: ${WEB_REVISION:-local}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_FILE_API_BASE_URL: ${NEXT_PUBLIC_FILE_API_BASE_URL}
    restart: unless-stopped
    expose:
      - "3000"

  mcp-server:
    image: timia-mcp-server:prod
    build:
      context: ./codes/mcp-server
      args:
        BUILD_REVISION: ${MCP_SERVER_REVISION:-local}
    restart: unless-stopped
    env_file: ${TIMIA_ENV_FILE:?set TIMIA_ENV_FILE — use deploy/dc.sh}
    environment:
      TIMIA_API_BASE: http://core-service:8000
      TIMIA_MCP_TRANSPORT: http
      TIMIA_MCP_HOST: 0.0.0.0
      TIMIA_MCP_PORT: "8100"
      TIMIA_MCP_PATH: /mcp
      PATH: /app/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    # No process TIMIA_PAT — each MCP request carries Authorization: Bearer tm_pat_…
    expose:
      - "8100"
    depends_on:
      - core-service

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - core-service
      - file-service
      - web
      - mcp-server

volumes:
  timia_pgdata:
  timia_minio:
