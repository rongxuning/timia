# Timia production — https://timia.online
#   /                    → Next.js (web:3000)
#   /auth/               → core-service:8000/auth/  (cookie scope, see below)
#   /core-service/       → core-service:8000 (prefix stripped)
#   /mcp                 → mcp-server:8100 (Streamable HTTP; Authorization required)
#   /mcp-health          → mcp-server:8100/health (no auth)
#   /notification-service/ → (future) notification-service:8001
#   /finance-service/    → (future) finance-service:8002
#
# .env.prod:
#   NEXT_PUBLIC_API_BASE_URL=https://timia.online/core-service
#   CORS_ORIGINS=https://timia.online
#
# Why a separate /auth/ location: the web SPA targets /auth/* as relative
# paths so the browser sees them as same-origin and sends the HttpOnly RT
# cookie on POST (SameSite=Lax). This is the prod equivalent of the dev
# `next.config.js` rewrite that does the same trick on port 3000.

upstream timia_web {
    server web:3000;
}

upstream timia_core_service {
    server core-service:8000;
}

upstream timia_mcp_server {
    server mcp-server:8100;
}

server {
    listen 80;
    server_name timia.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name timia.online;

    ssl_certificate     /etc/letsencrypt/live/timia.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timia.online/privkey.pem;

    location /core-service/ {
        proxy_pass http://timia_core_service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth endpoints — same cookie scope as dev (Next.js reverse proxy) so the
    # SameSite=Lax RT cookie is sent on cross-origin-equivalent POST. The
    # frontend targets these as relative `/auth/*` paths, so the browser sees
    # them as same-origin (timia.online).
    location /auth/ {
        proxy_pass http://timia_core_service/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP health (unauthenticated). Prefer this over /health on the public host
    # because / belongs to the web app.
    location = /mcp-health {
        proxy_pass http://timia_mcp_server/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Streamable HTTP MCP — forward Authorization; long timeouts; no buffering.
    location /mcp {
        proxy_pass http://timia_mcp_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://timia_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
