name: Timia
options:
  bundleIdPrefix: online.timia
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Timia:
    type: application
    platform: iOS
    sources:
      - path: Timia
        excludes:
          - Resources/Assets.xcassets
      - path: Timia/Resources/Assets.xcassets
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.timia.ios
        PRODUCT_NAME: Timia
        INFOPLIST_FILE: Timia/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Timia/Resources/Timia.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - sdk: HealthKit.framework
      - sdk: ActivityKit.framework
      - target: TimiaWidget
        embed: true
    scheme:
      testTargets:
        - TimiaTests
        - TimiaUITests
  TimiaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TimiaWidget
      - path: Timia/Core/ScreenNotification/TimiaScreenActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.timia.ios.widget
        PRODUCT_NAME: TimiaWidget
        INFOPLIST_FILE: TimiaWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: TimiaWidget/TimiaWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: YES
        DEVELOPMENT_TEAM: QTV9DUCAY7
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
  TimiaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TimiaTests
    dependencies:
      - target: Timia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.timia.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  TimiaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TimiaUITests
    dependencies:
      - target: Timia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.timia.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
