services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: timia
      POSTGRES_PASSWORD: timia
      POSTGRES_DB: timia
    ports:
      - "5432:5432"
    volumes:
      - timia_pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: timia
      MINIO_ROOT_PASSWORD: timia_minio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - timia_minio:/data

volumes:
  timia_pgdata:
  timia_minio:
